name: Publicar preview do Cifra Estudio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão de teste do Cifra Estudio
        uses: actions/checkout@v4
        with:
          repository: celsomartins251/cifra-estudio
          ref: test/disable-playback-visuals
          path: site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar preview
        id: deployment
        uses: actions/deploy-pages@v4
